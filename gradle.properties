# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the command line, check
# build.gradle files instead.

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true

# AndroidX package structure to make it unambiguous which package is being used
android.useAndroidX=true

# Kotlin code style for this project: "official" or "relaxed"
kotlin.code.style=official

# Enable Jetpack Compose support
android.enableJetifier=true
